<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typo Tactics (漢字将棋)</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --p1-color: #3b82f6;
      --p2-color: #ef4444;
      --empty-color: #334155;
      --text-color: #f8fafc;
      --accent-color: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 15px;
    }

    .game-container {
      width: 100%; max-width: 480px;
      display: flex; flex-direction: column; gap: 15px; align-items: center;
    }

    header { text-align: center; margin-bottom: 5px; }
    h1 { font-size: 1.8rem; letter-spacing: 2px; color: var(--text-color); }

    .scoreboard {
      display: flex; justify-content: space-between; width: 100%;
      background: var(--panel-bg); padding: 12px 20px; border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    .player-score {
      display: flex; flex-direction: column; align-items: center;
      padding: 6px 16px; border-radius: 8px; transition: all 0.3s ease; opacity: 0.6;
    }
    .player-score.active { opacity: 1; transform: scale(1.05); }
    .p1-score.active { background: rgba(59, 130, 246, 0.2); border: 2px solid var(--p1-color); }
    .p2-score.active { background: rgba(239, 68, 68, 0.2); border: 2px solid var(--p2-color); }
    .p-name { font-size: 0.85rem; font-weight: bold; }
    .p-score { font-size: 1.5rem; font-weight: bold; }

    .board {
      display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr);
      gap: 8px; width: 100%; aspect-ratio: 1; background: var(--panel-bg);
      padding: 12px; border-radius: 16px; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .cell {
      background: var(--empty-color); border-radius: 8px;
      display: flex; justify-content: center; align-items: center;
      font-size: 1.8rem; font-weight: bold; cursor: pointer;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }
    .cell:hover { transform: translateY(-2px); background: #475569; }
    .cell.p1 { background: var(--p1-color); color: white; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.5); }
    .cell.p2 { background: var(--p2-color); color: white; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.5); }

    .hand-container {
      width: 100%; background: var(--panel-bg); padding: 15px; border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .hand-title { font-size: 0.9rem; color: #94a3b8; font-weight: bold; }
    .hand-cards { display: flex; gap: 10px; justify-content: center; width: 100%; }

    .card {
      width: 55px; height: 55px; background: #334155; border-radius: 10px;
      display: flex; justify-content: center; align-items: center;
      font-size: 1.5rem; font-weight: bold; cursor: pointer;
      border: 2px solid transparent; transition: all 0.2s;
    }
    .card:hover { transform: translateY(-4px); }
    .card.selected {
      border-color: var(--accent-color); background: #475569;
      transform: translateY(-6px) scale(1.05); box-shadow: 0 0 15px var(--accent-color);
    }

    .combo-popup {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
      background: linear-gradient(135deg, #f59e0b, #ef4444); color: white;
      padding: 15px 25px; border-radius: 20px; font-weight: bold; font-size: 1.4rem;
      text-align: center; z-index: 100; pointer-events: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .combo-popup.show { transform: translate(-50%, -50%) scale(1); }

    .status-msg { height: 24px; font-size: 1rem; color: var(--accent-color); font-weight: bold; text-align: center; }
  </style>
</head>
<body>

<div class="game-container">
  <header>
    <h1>Typo Tactics</h1>
  </header>

  <div class="scoreboard">
    <div class="player-score p1-score active" id="p1-panel">
      <span class="p-name">プレイヤー 1 (青)</span>
      <span class="p-score" id="p1-score">0画</span>
    </div>
    <div class="player-score p2-score" id="p2-panel">
      <span class="p-name">プレイヤー 2 (赤)</span>
      <span class="p-score" id="p2-score">0画</span>
    </div>
  </div>

  <div class="status-msg" id="status-msg">手札を選んでマスに置いてください</div>

  <div class="board" id="board"></div>

  <div class="hand-container">
    <div class="hand-title" id="hand-owner">プレイヤー1の手札</div>
    <div class="hand-cards" id="hand-cards"></div>
  </div>
</div>

<div class="combo-popup" id="combo-popup">🔥 合体成功! 🔥<br><span id="combo-detail"></span></div>

<script>
  // 3文字合体レシピ
  const RECIPES_3 = [
    { parts: ["矢", "口", "日"], result: "智", strokes: 12 },
    { parts: ["木", "木", "木"], result: "森", strokes: 12 },
    { parts: ["女", "宀", "子"], result: "字", strokes: 6 },
    { parts: ["日", "寺", "言"], result: "誓", strokes: 14 }
  ];

  // 2文字合体レシピ
  const RECIPES_2 = [
    { parts: ["氵", "可"], result: "河", strokes: 8 },
    { parts: ["木", "木"], result: "林", strokes: 8 },
    { parts: ["木", "目"], result: "相", strokes: 9 },
    { parts: ["日", "月"], result: "明", strokes: 8 },
    { parts: ["女", "子"], result: "好", strokes: 6 },
    { parts: ["亻", "門"], result: "閃", strokes: 10 },
    { parts: ["立", "日"], result: "音", strokes: 9 },
    { parts: ["心", "田"], result: "思", strokes: 9 },
    { parts: ["矢", "口"], result: "知", strokes: 8 },
    { parts: ["口", "日"], result: "唱", strokes: 11 }
  ];

  const CARD_POOL = ["氵", "可", "木", "目", "日", "月", "女", "子", "矢", "口", "立", "心", "田", "宀", "寺", "言"];

  let boardState = Array(25).fill(null);
  let currentPlayer = 1;
  let p1Hand = [], p2Hand = [];
  let selectedCardIndex = null;

  function initGame() {
    p1Hand = Array(4).fill(0).map(() => getRandomCard());
    p2Hand = Array(4).fill(0).map(() => getRandomCard());
    createBoard();
    updateUI();
  }

  function getRandomCard() {
    return CARD_POOL[Math.floor(Math.random() * CARD_POOL.length)];
  }

  function createBoard() {
    const boardEl = document.getElementById("board");
    boardEl.innerHTML = "";
    for (let i = 0; i < 25; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.index = i;
      cell.addEventListener("click", () => handleCellClick(i));
      boardEl.appendChild(cell);
    }
  }

  function selectCard(index) {
    selectedCardIndex = index;
    updateUI();
  }

  function handleCellClick(index) {
    if (boardState[index] !== null || selectedCardIndex === null) return;

    const currentHand = currentPlayer === 1 ? p1Hand : p2Hand;
    const placedChar = currentHand[selectedCardIndex];

    // 1. 配置
    boardState[index] = { char: placedChar, player: currentPlayer, strokes: 1 };
    currentHand[selectedCardIndex] = getRandomCard();
    selectedCardIndex = null;

    // 2. 合体判定 (3文字優先 -> 2文字)
    checkCombination(index);

    // 3. ターン交代
    currentPlayer = currentPlayer === 1 ? 2 : 1;
    updateUI();
  }

  function checkCombination(centerIdx) {
    const adjIndices = getAdjacentIndices(centerIdx);

    // --- 3文字合体チェック ---
    for (let recipe of RECIPES_3) {
      for (let i = 0; i < adjIndices.length; i++) {
        for (let j = i + 1; j < adjIndices.length; j++) {
          const idx1 = adjIndices[i];
          const idx2 = adjIndices[j];

          if (boardState[idx1] && boardState[idx2]) {
            const chars = [boardState[centerIdx].char, boardState[idx1].char, boardState[idx2].char].sort();
            const targetChars = [...recipe.parts].sort();

            if (JSON.stringify(chars) === JSON.stringify(targetChars)) {
              boardState[centerIdx] = { char: recipe.result, player: currentPlayer, strokes: recipe.strokes };
              boardState[idx1] = null; // 吸収消滅
              boardState[idx2] = null; // 吸収消滅
              showPopup(`🔥 3文字大合体! ${recipe.result} (+${recipe.strokes}画) 🔥`);
              return;
            }
          }
        }
      }
    }

    // --- 2文字合体チェック ---
    for (let adjIdx of adjIndices) {
      if (boardState[adjIdx]) {
        for (let recipe of RECIPES_2) {
          const chars = [boardState[centerIdx].char, boardState[adjIdx].char].sort();
          const targetChars = [...recipe.parts].sort();

          if (JSON.stringify(chars) === JSON.stringify(targetChars)) {
            boardState[centerIdx] = { char: recipe.result, player: currentPlayer, strokes: recipe.strokes };
            boardState[adjIdx] = null; // 吸収消滅
            showPopup(`合体! ${recipe.result} (+${recipe.strokes}画)`);
            return;
          }
        }
      }
    }
  }

  function getAdjacentIndices(idx) {
    const row = Math.floor(idx / 5);
    const col = idx % 5;
    const list = [];
    if (row > 0) list.push(idx - 5);
    if (row < 4) list.push(idx + 5);
    if (col > 0) list.push(idx - 1);
    if (col < 4) list.push(idx + 1);
    return list;
  }

  function showPopup(text) {
    const popup = document.getElementById("combo-popup");
    document.getElementById("combo-detail").innerText = text;
    popup.classList.add("show");
    setTimeout(() => popup.classList.remove("show"), 1500);
  }

  function updateUI() {
    const cells = document.querySelectorAll(".cell");
    let p1Strokes = 0, p2Strokes = 0;

    cells.forEach((cell, idx) => {
      const state = boardState[idx];
      cell.className = "cell";
      if (state) {
        cell.innerText = state.char;
        cell.classList.add(state.player === 1 ? "p1" : "p2");
        if (state.player === 1) p1Strokes += state.strokes;
        if (state.player === 2) p2Strokes += state.strokes;
      } else {
        cell.innerText = "";
      }
    });

    document.getElementById("p1-score").innerText = p1Strokes + "画";
    document.getElementById("p2-score").innerText = p2Strokes + "画";

    document.getElementById("p1-panel").className = `player-score p1-score ${currentPlayer === 1 ? "active" : ""}`;
    document.getElementById("p2-panel").className = `player-score p2-score ${currentPlayer === 2 ? "active" : ""}`;

    const handCardsEl = document.getElementById("hand-cards");
    const currentHand = currentPlayer === 1 ? p1Hand : p2Hand;
    document.getElementById("hand-owner").innerText = `プレイヤー${currentPlayer} (${currentPlayer === 1 ? "青" : "赤"}) の手札`;

    handCardsEl.innerHTML = "";
    currentHand.forEach((char, idx) => {
      const card = document.createElement("div");
      card.className = `card ${selectedCardIndex === idx ? "selected" : ""}`;
      card.innerText = char;
      card.addEventListener("click", () => selectCard(idx));
      handCardsEl.appendChild(card);
    });
  }

  initGame();
</script>
</body>
</html>
