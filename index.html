<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Evolution</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --p1-color: #3b82f6;
      --p2-color: #ef4444;
      --empty-color: #334155;
      --text-color: #f8fafc;
      --accent-color: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    header {
      text-align: center;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.5rem;
      color: var(--accent-color);
      letter-spacing: 2px;
    }

    .status-container {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 400px;
      margin-bottom: 10px;
      background: var(--panel-bg);
      padding: 10px;
      border-radius: 8px;
    }

    .player-status {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      padding: 4px;
      border-radius: 6px;
      transition: all 0.3s;
    }

    .player-status.active.p1-status {
      border: 2px solid var(--p1-color);
      background: rgba(59, 130, 246, 0.15);
    }

    .player-status.active.p2-status {
      border: 2px solid var(--p2-color);
      background: rgba(239, 68, 68, 0.15);
    }

    .p1-text { color: var(--p1-color); font-weight: bold; }
    .p2-text { color: var(--p2-color); font-weight: bold; }

    .score {
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .board-container {
      position: relative;
      margin-bottom: 15px;
      width: 100%;
      max-width: 360px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-gap: 6px;
      background: var(--panel-bg);
      padding: 8px;
      border-radius: 10px;
      width: 100%;
    }

    .cell {
      background: var(--empty-color);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      position: relative;
      transition: all 0.2s;
      aspect-ratio: 1 / 1;
      width: 100%;
    }

    .cell.p1 { background: rgba(59, 130, 246, 0.25); border: 2px solid var(--p1-color); }
    .cell.p2 { background: rgba(239, 68, 68, 0.25); border: 2px solid var(--p2-color); }

    .cell .kanji {
      font-size: 1.5rem;
      font-weight: bold;
      line-height: 1;
    }

    .cell .strokes {
      font-size: 0.6rem;
      opacity: 0.85;
      position: absolute;
      bottom: 2px;
      right: 4px;
    }

    .cell.merge-anim {
      animation: pulse 0.4s ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.15); filter: brightness(1.8); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    .controls {
      width: 100%;
      max-width: 400px;
      background: var(--panel-bg);
      padding: 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hand-title {
      font-size: 0.85rem;
      text-align: center;
      color: #94a3b8;
    }

    .hand-options {
      display: flex;
      justify-content: space-around;
      gap: 8px;
    }

    .hand-btn {
      flex: 1;
      background: var(--empty-color);
      color: var(--text-color);
      padding: 8px;
      border-radius: 6px;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.2s;
    }

    .hand-btn.p1-turn { border: 2px solid var(--p1-color); }
    .hand-btn.p2-turn { border: 2px solid var(--p2-color); }

    .hand-btn span.sub {
      font-size: 0.65rem;
      font-weight: normal;
      color: #94a3b8;
      margin-top: 2px;
    }

    .hand-btn.selected.p1-turn {
      background: rgba(59, 130, 246, 0.3);
      box-shadow: 0 0 8px var(--p1-color);
    }

    .hand-btn.selected.p2-turn {
      background: rgba(239, 68, 68, 0.3);
      box-shadow: 0 0 8px var(--p2-color);
    }

    .msg-box {
      margin-top: 10px;
      text-align: center;
      font-size: 0.9rem;
      min-height: 1.2rem;
      color: var(--accent-color);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: var(--panel-bg);
      padding: 24px;
      border-radius: 12px;
      text-align: center;
      max-width: 320px;
      width: 90%;
      border: 2px solid var(--accent-color);
    }

    .modal-title {
      font-size: 1.5rem;
      color: var(--accent-color);
      margin-bottom: 12px;
    }

    .modal-result {
      font-size: 1.1rem;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .restart-btn {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Word Evolution</h1>
  </header>

  <div class="status-container">
    <div class="player-status p1-status active" id="p1-panel">
      <span class="p1-text">プレイヤー1 (青)</span>
      <span class="score" id="p1-score">総画数: 0画</span>
    </div>
    <div class="player-status p2-status" id="p2-panel">
      <span class="p2-text">プレイヤー2 (赤)</span>
      <span class="score" id="p2-score">総画数: 0画</span>
    </div>
  </div>

  <div class="board-container">
    <div class="board" id="board"></div>
  </div>

  <div class="controls">
    <div class="hand-title">配置する文字を選択してください</div>
    <div class="hand-options" id="hand"></div>
  </div>

  <div class="msg-box" id="msg"></div>

  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <div class="modal-title">GAME OVER</div>
      <div class="modal-result" id="modal-result"></div>
      <button class="restart-btn" onclick="resetGame()">もう一度遊ぶ</button>
    </div>
  </div>

  <script>
    // 正しい組み合わせのみに厳選した漢字データベース
    const KANJI_DB = {
      // 基本パーツ・へん
      "氵": { strokes: 3, merges: { "可": "河", "青": "清", "工": "江" } },
      "亻": { strokes: 2, merges: { "木": "休", "言": "信", "寺": "侍" } },
      "木": { strokes: 4, merges: { "木": "林", "目": "相" } },
      "扌": { strokes: 3, merges: { "寺": "持", "可": "打" } },
      "日": { strokes: 4, merges: { "月": "明", "青": "晴", "寺": "時" } },
      "土": { strokes: 3, merges: { "也": "地", "成": "城" } },
      "女": { strokes: 3, merges: { "子": "好", "少": "妙" } },
      "言": { strokes: 7, merges: { "成": "誠", "寺": "詩" } },
      "糸": { strokes: 6, merges: { "会": "絵", "吉": "結" } },

      // つくり・右側パーツ
      "可": { strokes: 5, merges: { "氵": "河", "扌": "打" } },
      "月": { strokes: 4, merges: { "日": "明" } },
      "青": { strokes: 8, merges: { "氵": "清", "日": "晴" } },
      "寺": { strokes: 6, merges: { "亻": "侍", "扌": "持", "日": "時", "言": "詩" } },
      "子": { strokes: 3, merges: { "女": "好" } },
      "少": { strokes: 4, merges: { "女": "妙" } },
      "成": { strokes: 6, merges: { "土": "城", "言": "誠" } },
      "也": { strokes: 3, merges: { "土": "地" } },
      "会": { strokes: 6, merges: { "糸": "絵" } },
      "吉": { strokes: 6, merges: { "糸": "結" } },
      "工": { strokes: 3, merges: { "氵": "江" } },
      "目": { strokes: 5, merges: { "木": "相" } },

      // 進化後の完成漢字（さらに合体可能なものも含む）
      "林": { strokes: 8, merges: { "木": "森" } },
      "森": { strokes: 12, merges: {} },
      "明": { strokes: 8, merges: {} },
      "晴": { strokes: 12, merges: {} },
      "休": { strokes: 6, merges: {} },
      "好": { strokes: 6, merges: {} },
      "清": { strokes: 11, merges: {} },
      "河": { strokes: 8, merges: {} },
      "時": { strokes: 10, merges: {} },
      "信": { strokes: 9, merges: {} },
      "地": { strokes: 6, merges: {} },
      "持": { strokes: 9, merges: {} },
      "絵": { strokes: 12, merges: {} },
      "結": { strokes: 12, merges: {} },
      "妙": { strokes: 7, merges: {} },
      "城": { strokes: 9, merges: {} },
      "誠": { strokes: 13, merges: {} },
      "詩": { strokes: 13, merges: {} },
      "侍": { strokes: 8, merges: {} },
      "打": { strokes: 5, merges: {} },
      "江": { strokes: 6, merges: {} },
      "相": { strokes: 9, merges: {} }
    };

    const BASE_POOL = ["氵", "亻", "木", "扌", "日", "土", "女", "言", "糸", "可", "月", "青", "寺", "子", "少", "成", "也", "会", "吉", "工", "目"];

    let boardState = Array(25).fill(null);
    let currentPlayer = 1;
    let selectedHandIndex = null;
    let currentHand = [];

    function initGame() {
      createBoard();
      generateHand();
      updateStatus();
    }

    function createBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      for (let i = 0; i < 25; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.index = i;
        cell.addEventListener('click', () => handleCellClick(i));
        boardEl.appendChild(cell);
      }
    }

    function generateHand() {
      currentHand = [];
      let pool = [...BASE_POOL];

      const allBoardChars = boardState.filter(c => c !== null).map(c => c.char);
      let synergicChars = [];
      allBoardChars.forEach(char => {
        Object.keys(KANJI_DB).forEach(key => {
          if (KANJI_DB[key].merges && KANJI_DB[key].merges[char]) {
            synergicChars.push(key);
          }
          if (KANJI_DB[char] && KANJI_DB[char].merges && KANJI_DB[char].merges[key]) {
            synergicChars.push(key);
          }
        });
      });

      while (currentHand.length < 2 && synergicChars.length > 0) {
        const randIdx = Math.floor(Math.random() * synergicChars.length);
        const picked = synergicChars[randIdx];
        if (!currentHand.includes(picked)) {
          currentHand.push(picked);
          pool = pool.filter(c => c !== picked);
        }
        synergicChars.splice(randIdx, 1);
      }

      while (currentHand.length < 3 && pool.length > 0) {
        const randIndex = Math.floor(Math.random() * pool.length);
        const picked = pool[randIndex];
        if (!currentHand.includes(picked)) {
          currentHand.push(picked);
        }
        pool.splice(randIndex, 1);
      }

      selectedHandIndex = null;
      renderHand();
    }

    function renderHand() {
      const handEl = document.getElementById('hand');
      handEl.innerHTML = '';
      const turnClass = currentPlayer === 1 ? 'p1-turn' : 'p2-turn';

      currentHand.forEach((char, idx) => {
        const btn = document.createElement('button');
        btn.className = `hand-btn ${turnClass} ${selectedHandIndex === idx ? 'selected' : ''}`;
        const strokes = KANJI_DB[char] ? KANJI_DB[char].strokes : 1;
        btn.innerHTML = `${char}<span class="sub">${strokes}画</span>`;
        btn.addEventListener('click', () => {
          selectedHandIndex = idx;
          renderHand();
        });
        handEl.appendChild(btn);
      });
    }

    function handleCellClick(index) {
      if (selectedHandIndex === null) {
        showMsg("下に表示されている文字を選択してください！");
        return;
      }

      if (boardState[index] !== null) {
        showMsg("空いているマスを選んでください。");
        return;
      }

      const placedChar = currentHand[selectedHandIndex];
      boardState[index] = {
        char: placedChar,
        player: currentPlayer
      };

      checkAndMergeAdjacent(index);

      renderBoard();
      updateStatus();

      if (boardState.every(cell => cell !== null)) {
        endGame();
        return;
      }

      currentPlayer = currentPlayer === 1 ? 2 : 1;
      generateHand();
      updatePlayerPanels();
      showMsg("");
    }

    function checkAndMergeAdjacent(placedIdx) {
      const neighbors = getAdjacentIndices(placedIdx);
      let currentCell = boardState[placedIdx];

      for (let nIdx of neighbors) {
        let neighborCell = boardState[nIdx];
        
        if (neighborCell) {
          const charA = currentCell.char;
          const charB = neighborCell.char;

          let mergedChar = null;
          if (KANJI_DB[charA] && KANJI_DB[charA].merges && KANJI_DB[charA].merges[charB]) {
            mergedChar = KANJI_DB[charA].merges[charB];
          } else if (KANJI_DB[charB] && KANJI_DB[charB].merges && KANJI_DB[charB].merges[charA]) {
            mergedChar = KANJI_DB[charB].merges[charA];
          }

          if (mergedChar) {
            boardState[placedIdx] = { char: mergedChar, player: currentCell.player };
            boardState[nIdx] = null;
            
            setTimeout(() => {
              const cells = document.querySelectorAll('.cell');
              if (cells[placedIdx]) cells[placedIdx].classList.add('merge-anim');
            }, 50);

            showMsg(`「${charA}」と「${charB}」が合体して「${mergedChar}」になった！`);
            break;
          }
        }
      }
    }

    function getAdjacentIndices(idx) {
      const row = Math.floor(idx / 5);
      const col = idx % 5;
      const list = [];

      if (row > 0) list.push(idx - 5);
      if (row < 4) list.push(idx + 5);
      if (col > 0) list.push(idx - 1);
      if (col < 4) list.push(idx + 1);

      return list;
    }

    function renderBoard() {
      const cells = document.querySelectorAll('.cell');
      boardState.forEach((data, i) => {
        const cell = cells[i];
        cell.className = 'cell';
        
        if (data) {
          cell.classList.add(`p${data.player}`);
          const strokes = KANJI_DB[data.char] ? KANJI_DB[data.char].strokes : 1;
          cell.innerHTML = `
            <span class="kanji">${data.char}</span>
            <span class="strokes">${strokes}画</span>
          `;
        } else {
          cell.innerHTML = '';
        }
      });
    }

    function getScores() {
      let p1 = 0, p2 = 0;
      boardState.forEach(cell => {
        if (cell) {
          const strokes = KANJI_DB[cell.char] ? KANJI_DB[cell.char].strokes : 1;
          if (cell.player === 1) p1 += strokes;
          if (cell.player === 2) p2 += strokes;
        }
      });
      return { p1, p2 };
    }

    function updateStatus() {
      const { p1, p2 } = getScores();
      document.getElementById('p1-score').innerText = `総画数: ${p1}画`;
      document.getElementById('p2-score').innerText = `総画数: ${p2}画`;
    }

    function updatePlayerPanels() {
      const p1Panel = document.getElementById('p1-panel');
      const p2Panel = document.getElementById('p2-panel');

      if (currentPlayer === 1) {
        p1Panel.classList.add('active');
        p2Panel.classList.remove('active');
      } else {
        p2Panel.classList.add('active');
        p1Panel.classList.remove('active');
      }
    }

    function endGame() {
      const { p1, p2 } = getScores();
      let winnerMsg = "";

      if (p1 > p2) {
        winnerMsg = `<span style="color: var(--p1-color); font-weight: bold;">プレイヤー1 (青)</span> の勝利！🏆`;
      } else if (p2 > p1) {
        winnerMsg = `<span style="color: var(--p2-color); font-weight: bold;">プレイヤー2 (赤)</span> の勝利！🏆`;
      } else {
        winnerMsg = `引き分け！🤝`;
      }

      const resultText = `
        すべてのマスが埋まりました！<br><br>
        プレイヤー1: ${p1}画<br>
        プレイヤー2: ${p2}画<br><br>
        ${winnerMsg}
      `;

      document.getElementById('modal-result').innerHTML = resultText;
      document.getElementById('modal').style.display = 'flex';
    }

    function resetGame() {
      boardState = Array(25).fill(null);
      currentPlayer = 1;
      document.getElementById('modal').style.display = 'none';
      initGame();
      renderBoard();
      updatePlayerPanels();
      showMsg("");
    }

    function showMsg(txt) {
      document.getElementById('msg').innerText = txt;
    }

    initGame();
  </script>
</body>
</html>
